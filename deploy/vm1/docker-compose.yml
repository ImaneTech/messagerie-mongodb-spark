services:
  mongo1:
    image: mongo:7
    container_name: mongo1
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    ports: ["27017:27017"]
    volumes: [mongo1-data:/data/db]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat_net

  spark-master:
    image: apache/spark:3.5.3-python3
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    environment:
      SPARK_PUBLIC_DNS: 192.168.0.100
      MONGO_URI: mongodb://192.168.0.100:27017,192.168.0.101:27017,192.168.0.102:27017/chatdb?replicaSet=rs0&readPreference=primaryPreferred
      MONGO_DB: chatdb
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ..:/workspace
    restart: unless-stopped
    depends_on:
      mongo1:
        condition: service_healthy
    networks:
      - chat_net

networks:
  chat_net:
    driver: bridge

volumes:
  mongo1-data:
