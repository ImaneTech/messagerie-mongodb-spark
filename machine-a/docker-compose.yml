services:
  mongo1:
    image: mongo:7
    container_name: mongo1
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    ports: ["27017:27017"]
    volumes: [mongo1-data:/data/db]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat_net

  mongo2:
    image: mongo:7
    container_name: mongo2
    command: mongod --replSet rs0 --bind_ip_all --port 27018
    ports: ["27018:27018"]
    volumes: [mongo2-data:/data/db]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat_net

  spark-master:
    image: apache/spark:3.5.3-python3
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    environment:
      SPARK_PUBLIC_DNS: ${IP_A}
      MONGO_URI: mongodb://${IP_A}:27017,${IP_A}:27018,${IP_B}:27019/?replicaSet=rs0&readPreference=primaryPreferred
    ports:
      - "18080:8080"
      - "7077:7077"
    volumes:
      - ../spark:/opt/spark-jobs
    restart: unless-stopped
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
    networks:
      - chat_net

  spark-worker1:
    image: apache/spark:3.5.3-python3
    container_name: spark-worker1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_PUBLIC_DNS: ${IP_A}
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      MONGO_URI: mongodb://${IP_A}:27017,${IP_A}:27018,${IP_B}:27019/?replicaSet=rs0&readPreference=primaryPreferred
    ports:
      - "18081:8081"
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_started
    networks:
      - chat_net

  spark-worker2:
    image: apache/spark:3.5.3-python3
    container_name: spark-worker2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_PUBLIC_DNS: ${IP_A}
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      MONGO_URI: mongodb://${IP_A}:27017,${IP_A}:27018,${IP_B}:27019/?replicaSet=rs0&readPreference=primaryPreferred
    ports:
      - "18082:8081"
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_started
    networks:
      - chat_net

networks:
  chat_net:
    driver: bridge

volumes:
  mongo1-data:
    name: pc-a_mongo1-data
  mongo2-data:
    name: pc-a_mongo2-data
