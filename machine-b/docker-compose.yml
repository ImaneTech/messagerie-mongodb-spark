services:
  mongo3:
    image: mongo:7
    container_name: mongo3
    command: mongod --replSet rs0 --bind_ip_all --port 27019
    ports: ["27019:27019"]
    volumes: [mongo3-data:/data/db]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat_net

  spark-worker2:
    image: apache/spark:3.5.3-python3
    container_name: spark-worker2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://${IP_A}:7077
    environment:
      SPARK_PUBLIC_DNS: ${IP_B}
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      MONGO_URI: mongodb://${IP_A}:27017,${IP_A}:27018,${IP_B}:27019/?replicaSet=rs0&readPreference=primaryPreferred
    ports:
      - "18082:8081"
    restart: unless-stopped
    networks:
      - chat_net

networks:
  chat_net:
    driver: bridge

volumes:
  mongo3-data:
    name: pc-b_mongo3-data
